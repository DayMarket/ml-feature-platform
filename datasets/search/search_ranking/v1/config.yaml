resources:
  path: ../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-dataset-search-ranking-v1
  main_application_file: local:///git/repo/datasets/search/search_ranking/v1/entrypoints/get_search_ranking_dataset.py
  resource_profile: search_dataset

table:
  key: dataset_search_ranking_v1
  catalog: iceberg
  schema: silver
  name: feature_platform_dataset_search_ranking_v1
  primary_key: collection_date,event_date,install_id,session_id,query,position
  meta:
    team: team:search
dag:
  team: search
  group_tag: search-ranking-dataset
  schedule: "0 10 * * *"
  start_date: "2026-04-01T00:00:00Z"

alerts:
  team: search
  severity: P4
  oncall_webhook_conn_id: oncall_webhook_search

dq:
  trino_conn_id: trino_search
  # Партиция таблицы — collection_date (PARTITIONED BY (collection_date) в
  # migrations/create_table.sql), не date и не event_date (event_date — производная
  # бизнес-дата = collection_date - 20 дней). Джоб пишет
  # collection_date = date(partition_start), см. job/getting_search_ranking_dataset.py.
  partition_column: collection_date
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  tests:
    # Раскатка DQ идёт на витрины, часть которых пуста или отстала на недели.
    # Объёмные тесты и freshness — в warn: состояние фиксируется в
    # feature_platform_dq_results, но дежурного не будит. Перевод в error —
    # по мере починки витрины, с порогом по её реальной истории (AGENTS.md).
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn

feature_stats:
  trino_conn_id: trino_search
  # Дословно совпадает с dq.partition_date_template и dq.partition_column: обе
  # таски обязаны смотреть на одну партицию, иначе профиль посчитан не по тем данным.
  partition_column: collection_date
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  exclude_columns:
    - sku_group_id
