resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-silver-sku-group-statistics
  main_application_file: local:///git/repo/layers/silver/sku_group_id_query_category/sku_group_install/v1/entrypoints/get_search_sku_group_silver_stats.py
  resource_profile: large

table:
  key: sku_group_install_silver_stats
  catalog: iceberg
  schema: silver
  name: feature_platform_search_sku_group_id_install_query
  primary_key: sku_group_id,install_id,query
  meta:
    team: team:search
dag:
  team: search

alerts:
  team: search
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_search

dq:
  trino_conn_id: trino_search
  # migrations/create_table.sql определяет date DATE, PARTITIONED BY (date), и джоб
  # пишет .overwritePartitions() от partition_date = parse_partition_date(partition_start)
  # (job/getting_sku_group_query_statistics.py). table.primary_key в этом конфиге date
  # не перечисляет — это отдельный контракт-баг конфига, не повод отключать партиционный DQ.
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  tests:
    # Раскатка DQ идёт на витрины, часть которых пуста или отстала на недели.
    # Объёмные тесты и freshness — в warn: состояние фиксируется в
    # feature_platform_dq_results, но дежурного не будит. Перевод в error —
    # по мере починки витрины, с порогом по её реальной истории (AGENTS.md).
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn

feature_stats:
  trino_conn_id: trino_search
  # Дословно совпадает с dq.partition_date_template: обе таски обязаны
  # смотреть на одну партицию, иначе профиль посчитан не по тем данным.
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  exclude_columns: []
