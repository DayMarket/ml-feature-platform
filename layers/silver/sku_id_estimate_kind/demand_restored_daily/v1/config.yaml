table:
  key: demand_restored_daily
  catalog: iceberg
  schema: silver
  name: feature_platform_demand_restored_daily
  primary_key: date,sku_id,estimate_kind
  meta:
    team: team:operations
source:
  conn_id: clickhouse_dwh_team_logistics
  database: sku_sales_forecast
  table: demand_forecast_demand_panel
  registry_table: demand_forecast_run
  stage: e3
  contract_version: exact_e3_daily_copy_v1
runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2
  cpu: "2"
  memory: 8Gi
  run_timeout_seconds: 604800
  max_batch_rows: 100000
  max_batch_bytes: 67108864
  delivery_status: prepared_local
dag:
  id: feature-platform.layers.silver.sku_id_estimate_kind.demand_restored_daily
  group_tag: demand-forecast
  team: operations
  owner: team:operations
  schedule: null
  start_date: "2026-09-08T00:00:00Z"
  catchup: false
alerts:
  team: operations-analytics
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_operations
# Пороги базовые, без прогрева; DQ/stats проверяют все даты writer receipt.
dq:
  trino_conn_id: trino_search
  warmup_days: 0
  partition_column: date
  partition_date_template: '{{ ti.xcom_pull(task_ids="write_range")["dates"][-1] }}'
  tests:
    - name: row_count_growth
      enabled: false
    - name: freshness
      enabled: false
    - name: accepted_values
      column: estimate_kind
      values: [provisional, final]
    - name: accepted_values
      column: quality_status
      values: [ok, unavailable]
    - name: accepted_values
      column: rate_ok
      values: [0, 1]
    - name: accepted_range
      column: sku_id
      min: 1
    - name: accepted_range
      column: source_state_version
      min: 1
    - name: not_null
      columns: [run_id, prediction_date, sales_units, source_updated_at, source_state_version, source_model_version, source_code_version, source_catalog_version, source_manifest_id, source_contract_version, ingested_at]
feature_stats:
  trino_conn_id: trino_search
  partition_column: date
  partition_date_template: '{{ ti.xcom_pull(task_ids="write_range")["dates"][-1] }}'
  exclude_columns: [source_state_version]
