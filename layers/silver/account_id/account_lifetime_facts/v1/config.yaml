# ClickHouse-source layer pipeline (Airflow/Python + pyiceberg), not Spark.
# Runtime/source contract is documented here; the Spark `spark`/`resources`
# blocks are intentionally absent (see AGENTS.md Trino/ClickHouse-source pattern).
table:
  key: account_lifetime_facts
  catalog: iceberg
  schema: silver
  name: feature_platform_account_lifetime_facts
  primary_key: date,account_id
  meta:
    team: team:buyer

source:
  engine: clickhouse
  # Коннекшн заводится DE по конвенции clickhouse_<dag>_dag; заявка — в PR.
  clickhouse_conn_id: clickhouse_account_lifetime_facts_dag

runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2

dag:
  id: feature-platform.layers.silver.account_id.account_lifetime_facts
  group_tag: buyout-features
  schedule: "0 2 * * *"
  start_date: "2026-08-20T00:00:00Z"
  team: buyer
  owner: team:buyer

alerts:
  team: buyer
  severity: P2
  oncall_webhook_conn_id: team:buyer
