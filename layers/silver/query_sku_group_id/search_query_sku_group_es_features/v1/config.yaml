# Trino + Elasticsearch-source layer pipeline (Airflow/Python + pyiceberg), not Spark.
table:
  key: search_query_sku_group_es_features
  catalog: iceberg
  schema: silver
  name: feature_platform_search_query_sku_group_es_features
  primary_key: date,query,sku_group_id
  meta:
    team: team:search

source:
  engine: trino_elasticsearch
  trino_conn_id: trino_search
  clickstream_events_table: '"dwh-iceberg".silver_b2c_clickstream.events'
  search_logs_table: '"dwh-iceberg".silver.search_logs'
  min_result_query_installs: 2
  elasticsearch:
    conn_id: elasticsearch_search
    endpoint_path: /search-sku-index/_search
    size: 2000
    parallel_jobs: 24
    chunk_size: 2000
    write_chunk_size: 50000
    request_timeout_seconds: 60
    retry_count: 3
    # Scoring fields of the production search query, without its boosts: every field is
    # collected with boost 1 so production weights can be applied downstream.
    fields:
      - sku.title
      - sku.title.synonym
      - sku.title_discovery
      - sku.title_discovery.synonym
      - sku.title_discovery_without_excluded_filters
      - sku.title_discovery_without_excluded_filters.synonym
      - sku.discovery_filter_values.title.ru
      - sku.discovery_filter_values.title.uz
      - sku.filter_values.title.ru
      - sku.filter_values.title.uz
      - category.title.ru
      - category.title.uz
      - category.full_title.ru
      - category.full_title.uz
      - product.title.ru
      - product.title.uz
      - product.title.ru.synonym
      - product.title.uz.synonym
      - full_category_name

raw_storage:
  conn_id: search_research_bucket
  prefix: airflow/2026/bm25_features
  file_row_limit: 50000

runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2
  cpu: "20"
  memory: 48Gi

elasticsearch_collect_dag:
  id: feature-platform.layers.silver.query_sku_group_id.search_query_sku_group_es_features.elasticsearch_collect
  schedule: "0 4 * * *"
  start_date: "2026-03-13T00:00:00Z"
  team: search
  owner: team:search
  dagrun_timeout_hours: 72

dag:
  id: feature-platform.layers.silver.query_sku_group_id.search_query_sku_group_es_features
  group_tag: search-es-features
  start_date: "2026-03-13T00:00:00Z"
  team: search
  owner: team:search
  dagrun_timeout_hours: 24

alerts:
  team: search
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_search

dq:
  trino_conn_id: trino_search
  partition_date_template: '{{ (dag_run.conf or {}).get("partition_date") or macros.ds_add(ds, -1) }}'
  # Таблица наполняется нерегулярными ручными запусками, поэтому объём между днями
  # прыгает штатно, и growth здесь только предупреждает.
  tests:
    - name: row_count_growth
      max_growth_ratio: 0.5
      severity: warn
    - name: string_not_blank
      columns:
        - query

feature_stats:
  trino_conn_id: trino_search
  # Дословно совпадает с dq.partition_date_template: обе таски обязаны смотреть
  # на одну партицию, иначе профиль посчитан не по тем данным, что проверял DQ.
  partition_date_template: '{{ (dag_run.conf or {}).get("partition_date") or macros.ds_add(ds, -1) }}'
  # product_id — BIGINT-идентификатор, а не признак: профиль распределения по нему
  # бессмыслен. Остальные числовые колонки (sell_price, *_field, skg_orders,
  # product_orders, skg_rating, product_rating, bms, total_score) — признаки и
  # исключать их нельзя.
  exclude_columns: ["product_id"]
