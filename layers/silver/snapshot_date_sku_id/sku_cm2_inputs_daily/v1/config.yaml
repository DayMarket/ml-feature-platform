table:
  key: sku_cm2_inputs_daily
  catalog: iceberg
  schema: silver
  name: feature_platform_sku_cm2_inputs_daily
  primary_key: snapshot_date,sku_id
  meta:
    team: team::recsys
    create_dbt_pr: true
    create_maintenance_pr: true

source:
  engine: trino
  trino_conn_id: trino_recsys
  sku_table: '"dwh-clickhouse".dict.sku'
  prices_table: '"dwh-clickhouse".marts.daily_sku_quantity_eod'
  commission_table: '"dwh-iceberg".silver_apidb_kazanexpress.public_sku_actual_commission'
  orders_table: '"dwh-iceberg".silver.order_item_ue_buyer'
  commission_column: comission
  orders_lookback_days: 28
  default_dimensional_group: SMALL
  allowed_dimensional_groups:
    - SMALL
    - MEDIUM
    - LARGE
  min_commission_pct: 0
  max_commission_pct: 100

runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2
  resources:
    cpu: "4"
    memory: 24Gi

dag:
  id: feature-platform.layers.silver.snapshot_date_sku_id.sku_cm2_inputs_daily
  group_tag: recsys-main-page-features
  schedule: "0 0 * * *"
  start_date: "2026-06-01T00:00:00Z"
  catchup: false
  team: recsys
  owner: team:recsys

alerts:
  team: recsys
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_recsys
