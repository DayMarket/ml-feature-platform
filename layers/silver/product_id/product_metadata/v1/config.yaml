resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-silver-product-metadata
  main_application_file: local:///git/repo/layers/silver/product_id/product_metadata/v1/entrypoints/get_product_metadata.py
  resource_profile: small

table:
  key: product_metadata
  catalog: iceberg
  schema: silver
  name: feature_platform_product_metadata
  primary_key: dt,product_id
  meta:
    team: team::recsys
    create_dbt_pr: true
    create_maintenance_pr: true

source:
  engine: spark_iceberg
  product_table: iceberg.silver.product
  category_table: iceberg.silver_apidb_kazanexpress.public_category
  sku_table: iceberg.silver.sku
  category_gender_table: iceberg.silver.recsys_category_genders
  technical_category_root_id: 1
  excluded_brand_id: 160078
  max_category_depth: 6

dag:
  id: feature-platform.layers.silver.product_id.product_metadata
  group_tag: recsys-features
  schedule: "0 19 * * *"
  start_date: "2026-08-07T19:00:00Z"
  catchup: true
  team: recsys
  owner: team:recsys

alerts:
  team: recsys
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_recsys
