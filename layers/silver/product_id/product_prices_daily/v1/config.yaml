# Trino-source layer pipeline (Airflow/Python + pyiceberg), not Spark.
table:
  key: product_prices_daily
  catalog: iceberg
  schema: silver
  name: feature_platform_product_prices_daily
  primary_key: dt,product_id
  meta:
    team: team::recsys
    create_dbt_pr: true
    create_maintenance_pr: true

source:
  engine: trino
  trino_conn_id: trino_recsys

runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2

dag:
  id: feature-platform.layers.silver.product_id.product_prices_daily
  group_tag: recsys-features
  schedule: "0 19 * * *"
  start_date: "2026-08-08T19:00:00Z"
  catchup: true
  team: recsys
  owner: team:recsys

alerts:
  team: recsys
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_recsys
