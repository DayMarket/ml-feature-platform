resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-silver-product-feedback-counts-12h
  main_application_file: local:///git/repo/layers/silver/product_id/product_feedback_counts_12h/v1/entrypoints/get_product_feedback_counts_12h.py
  resource_profile: small

table:
  key: product_feedback_counts_12h
  catalog: iceberg
  schema: silver
  name: feature_platform_product_feedback_counts_12h
  primary_key: calculated_at,product_id
  meta:
    team: team::recsys
    create_dbt_pr: false
    create_maintenance_pr: true

source:
  engine: spark_iceberg
  feedback_table: iceberg.silver_bxappdb2_foodback.public_feedback

dag:
  id: feature-platform.layers.silver.product_id.product_feedback_counts_12h
  group_tag: recsys-features
  schedule: "0 7,19 * * *"
  start_date: "2026-08-08T07:00:00Z"
  catchup: true
  team: recsys
  owner: team:recsys

dq:
  trino_conn_id: trino_recsys
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 12
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d %H:%M:%S") }}'
  tests:
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn

feature_stats:
  trino_conn_id: trino_recsys
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 12
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d %H:%M:%S") }}'
  exclude_columns: []
