resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-silver-sku-group-id-prices
  main_application_file: local:///git/repo/layers/silver/sku_group_id/sku_group_id_prices/v1/entrypoints/get_sku_group_id_prices.py
  resource_profile: small

table:
  key: sku_group_id_prices
  catalog: iceberg
  schema: silver
  name: feature_platform_sku_group_id_prices
  primary_key: date,sku_group_id
  meta:
    team: team:search
dag:
  team: search

alerts:
  team: search
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_search

dq:
  trino_conn_id: trino_search
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  tests:
    # Пилот: двусторонний growth впервые начнёт ловить обвалы объёма,
    # поэтому первые две недели держим его предупреждением.
    - name: row_count_growth
      max_growth_ratio: 0.2
      severity: warn
    - name: non_negative
      columns:
        - avg_sell_price_eod
        - median_sell_price_eod
        - min_sell_price_eod
        - max_sell_price_eod
        - avg_full_price_eod
        - median_full_price_eod
        - min_full_price_eod
        - max_full_price_eod
    - name: expression_is_true
      expression: "min_sell_price_eod <= median_sell_price_eod AND median_sell_price_eod <= max_sell_price_eod"
    - name: expression_is_true
      expression: "min_full_price_eod <= median_full_price_eod AND median_full_price_eod <= max_full_price_eod"

feature_stats:
  trino_conn_id: trino_search
  # Дословно совпадает с dq.partition_date_template: обе таски обязаны смотреть
  # на одну партицию, иначе профиль посчитан не по тем данным, что проверял DQ.
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  exclude_columns: []
