table:
  key: demand_stock_daily
  catalog: iceberg
  schema: silver
  name: feature_platform_demand_stock_daily
  primary_key: date,sku_id
  meta:
    team: team:operations

source:
  conn_id: clickhouse_dwh_team_logistics
  database: marts
  table: daily_sku_quantity_eod
  contract_version: source_eod_positive_availability_v1
  time_policy: source_eod_date_accepted

runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2
  cpu: "2"
  memory: 8Gi
  refresh_days: 31
  run_timeout_seconds:
    regular: 21600
    manual: 604800
  history_start: "2022-09-01"
  max_batch_rows: 100000
  max_batch_bytes: 67108864
  delivery_status: prepared_local

dag:
  id: feature-platform.layers.silver.sku_id.demand_stock_daily
  group_tag: demand-forecast
  team: operations
  owner: team:operations
  schedule: 0 4 * * *
  start_date: "2026-09-08T00:00:00Z"
  catchup: false

alerts:
  team: operations-analytics
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_operations

# Пока штатные пороги, не новые оценки по одному дню источника.
# 2026-08-31: 2 290 938 SKU с положительным active/FBS EOD.
# Полная source/read-back проверка диапазона обязательна сверх дневного DQ.
dq:
  trino_conn_id: trino_search
  warmup_days: 0
  partition_column: date
  partition_date_template: '{{ ti.xcom_pull(task_ids="write_range")["dates"][-1] }}'
  tests:
    # Freshness/growth по умолчанию: последний завершённый день на момент записи.
    # Исторические даты проверяет dq.day_range без этих двух временных тестов.
    - name: not_null
      columns: [source_manifest_id, source_contract_version, ingested_at]
    - name: accepted_range
      column: sku_id
      min: 1

feature_stats:
  trino_conn_id: trino_search
  partition_column: date
  partition_date_template: '{{ ti.xcom_pull(task_ids="write_range")["dates"][-1] }}'
