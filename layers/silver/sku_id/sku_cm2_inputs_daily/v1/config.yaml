table:
  key: sku_cm2_inputs_daily
  catalog: iceberg
  schema: silver
  name: feature_platform_sku_cm2_inputs_daily
  primary_key: dt,sku_id
  meta:
    team: team::recsys
    create_dbt_pr: false
    create_maintenance_pr: true

source:
  engine: trino
  trino_conn_id: trino_recsys
  sku_table: '"dwh-clickhouse".dict.sku'
  prices_table: '"dwh-clickhouse".marts.daily_sku_quantity_eod'
  commission_table: '"dwh-iceberg".silver_apidb_kazanexpress.public_sku_actual_commission'
  orders_table: '"dwh-iceberg".silver.order_item_ue_buyer'
runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2
  resources:
    cpu: "1"
    memory: 4Gi

dag:
  id: feature-platform.layers.silver.sku_id.sku_cm2_inputs_daily
  group_tag: recsys-features
  schedule: "0 19 * * *"
  start_date: "2026-08-08T19:00:00Z"
  catchup: true
  team: recsys
  owner: team:recsys

alerts:
  team: recsys
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_recsys

dq:
  trino_conn_id: trino_recsys
  partition_column: dt
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d") }}'
  tests:
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn

feature_stats:
  trino_conn_id: trino_recsys
  partition_column: dt
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d") }}'
  exclude_columns:
    - product_id
