table:
  key: demand_sales_daily
  catalog: iceberg
  schema: silver
  name: feature_platform_demand_sales_daily
  primary_key: date,sku_id
  meta:
    team: team:operations
source:
  contract_version: seller_sales_rollup_v1
inputs:
  seller_config: layers/silver/sku_id_seller_key/demand_seller_sales_observed_daily/v1/config.yaml
  trino_conn_id: trino_search
runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2
  cpu: "2"
  memory: 8Gi
  refresh_days: 31
  run_timeout_seconds:
    regular: 21600
    manual: 604800
  history_start: "2022-09-01"
  max_batch_rows: 100000
  max_batch_bytes: 67108864
  delivery_status: prepared_local
dag:
  id: feature-platform.layers.silver.sku_id.demand_sales_daily
  group_tag: demand-forecast
  team: operations
  owner: team:operations
  schedule: 0 4 * * *
  start_date: "2026-09-08T00:00:00Z"
  catchup: false
alerts:
  team: operations-analytics
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_operations
# Для range-DQ исторические даты не сравниваются с календарным yesterday.
dq:
  trino_conn_id: trino_search
  warmup_days: 0
  partition_column: date
  partition_date_template: '{{ ti.xcom_pull(task_ids="write_range")["dates"][-1] }}'
  tests:
    # Freshness/growth по умолчанию: последний завершённый день на момент записи.
    # Исторические даты проверяет dq.day_range без этих двух временных тестов.
    - name: not_null
      columns: [sales_units, sales_order_items, sales_orders, source_updated_at, fx_rate_source, fx_captured_at, source_manifest_id, source_contract_version, ingested_at]
    - name: accepted_values
      column: fx_rate_source
      values: [exact_date, latest_available, unavailable]
    - name: accepted_range
      column: sku_id
      min: 1
    - name: non_negative
      columns: [sales_units, sales_order_items, sales_orders, sales_gmv, sales_payment_value, sales_full_value, sales_seller_promo_value]
    - name: columns_sum_equals
      parts: [sales_units_fbo, sales_units_fbs, sales_units_dbs, sales_units_other, sales_units_unknown]
      total: sales_units
      tolerance: 0
feature_stats:
  trino_conn_id: trino_search
  partition_column: date
  partition_date_template: '{{ ti.xcom_pull(task_ids="write_range")["dates"][-1] }}'
