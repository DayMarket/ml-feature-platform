# Trino-source layer pipeline (Airflow/Python + pyiceberg), not Spark.
table:
  key: delivery_cpi_city_features
  catalog: iceberg
  schema: silver
  name: feature_platform_delivery_cpi_city_features
  primary_key: date,city_id,dimensional_group
  meta:
    team: team:buyer

source:
  engine: trino
  trino_conn_id: trino_bx_analytics
  # Скользящее окно до даты партиции: [date - 90 дней, date).
  lookback_days: 90

runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2

dag:
  id: feature-platform.layers.silver.city_id_dimensional_group.delivery_cpi_city_features
  group_tag: buyout-features
  schedule: "0 3 * * *"
  start_date: "2026-08-20T00:00:00Z"
  team: buyer
  owner: team:buyer

alerts:
  team: buyer
  severity: P2
  oncall_webhook_conn_id: team:buyer

dq:
  trino_conn_id: trino_search
  # Партиция вычисляется от data_interval_end без сдвига на -1 день (Pattern DE):
  # см. dag.py, комментарий "Партиция date равна дате конца интервала".
  partition_date_template: '{{ data_interval_end.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  tests:
    # Раскатка DQ идёт на витрины, часть которых пуста или отстала на недели.
    # Объёмные тесты и freshness — в warn: состояние фиксируется в
    # feature_platform_dq_results, но дежурного не будит. Перевод в error —
    # по мере починки витрины, с порогом по её реальной истории (AGENTS.md).
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn

feature_stats:
  trino_conn_id: trino_search
  # Дословно совпадает с dq.partition_date_template: обе таски обязаны
  # смотреть на одну партицию, иначе профиль посчитан не по тем данным.
  partition_date_template: '{{ data_interval_end.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  exclude_columns:
    - region_id
