resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-gold-query-category-relevance-expanded
  main_application_file: local:///git/repo/layers/gold/category_id_query_text/query_category_relevance_expanded/v1/entrypoints/get_query_category_relevance_expanded.py
  # Join ~2 млн строк витрины со справочником ~22 млн строк и окно по ~37 млн строк.
  resource_profile: medium

table:
  key: query_category_relevance_expanded
  catalog: iceberg
  schema: gold
  name: feature_platform_query_category_relevance_expanded
  primary_key: date,category_id,query_text
  meta:
    team: team:search

dag:
  id: feature-platform.layers.gold.category_id_query_text.query_category_relevance_expanded
  group_tag: query-category-relevance
  schedule: "30 3 * * *"
  start_date: "2026-09-15T00:00:00Z"
  team: search
  owner: team:search

alerts:
  team: search
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_search

dq:
  trino_conn_id: trino_search
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  tests:
    # Истории у таблицы нет, а исходная витрина пока наполняется вручную: объёмные
    # тесты и freshness в warn, пока пороги не подобраны по реальной истории
    # (AGENTS.md). Ключевые тесты остаются в error — это витрина признаков.
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn

feature_stats:
  trino_conn_id: trino_search
  # Дословно совпадает с dq.partition_date_template: обе таски обязаны
  # смотреть на одну партицию, иначе профиль посчитан не по тем данным.
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  exclude_columns: []
