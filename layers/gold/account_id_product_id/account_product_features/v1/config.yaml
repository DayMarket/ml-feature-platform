resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-gold-account-product-features
  main_application_file: local:///git/repo/layers/gold/account_id_product_id/account_product_features/v1/entrypoints/get_account_product_features.py
  resource_profile: small

table:
  key: account_product_features
  catalog: iceberg
  schema: gold
  name: feature_platform_account_product_features
  primary_key: calculated_at,account_id,product_id
  meta:
    team: team::recsys
    create_dbt_pr: false
    create_maintenance_pr: true

source:
  engine: spark_iceberg
  action_counts_table: iceberg.silver.feature_platform_account_product_session_action_counts_12h
  order_items_table: iceberg.silver.order_items
  sku_table: iceberg.silver.sku
  business_timezone: Asia/Tashkent
  event_windows_days: 3,7,14,28
  order_windows_days: 3,7,14,28,60,90
  successful_order_statuses: COMPLETED,PAID,DELIVERED,IN_DELIVERY

dag:
  id: feature-platform.layers.gold.account_id_product_id.account_product_features
  group_tag: recsys-features
  schedule: "0 7,19 * * *"
  start_date: "2026-08-08T07:00:00Z"
  catchup: true
  team: recsys
  owner: team:recsys

alerts:
  team: recsys
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_recsys

dq:
  trino_conn_id: trino_recsys
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 12
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d %H:%M:%S") }}'
  tests:
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn
    - name: non_negative
      columns:
        - pid_n_clicks_3d
        - pid_n_clicks_7d
        - pid_n_clicks_14d
        - pid_n_clicks_28d
        - pid_n_atcs_3d
        - pid_n_atcs_7d
        - pid_n_atcs_14d
        - pid_n_atcs_28d
        - pid_n_atfs_3d
        - pid_n_atfs_7d
        - pid_n_atfs_14d
        - pid_n_atfs_28d
        - pid_n_orders_3d
        - pid_n_orders_7d
        - pid_n_orders_14d
        - pid_n_orders_28d
        - pid_n_orders_60d
        - pid_n_orders_90d
        - pid_gmv_3d
        - pid_gmv_7d
        - pid_gmv_14d
        - pid_gmv_28d
        - pid_gmv_60d
        - pid_gmv_90d
    - name: expression_is_true
      expression: "account_id > 0 AND product_id > 0"
    - name: expression_is_true
      expression: "pid_n_orders_28d <= pid_n_orders_90d"
    - name: expression_is_true
      expression: "pid_n_orders_28d_over_90d IS NULL OR pid_n_orders_28d_over_90d BETWEEN 0 AND 1"
    - name: expression_is_true
      expression: "pid_neg_n_hours_since_last_click IS NULL OR pid_neg_n_hours_since_last_click <= 0"
    - name: expression_is_true
      expression: "pid_neg_n_hours_since_last_click_rel IS NULL OR pid_neg_n_hours_since_last_click_rel <= 0"
    - name: expression_is_true
      expression: "pid_neg_n_days_since_last_purchase IS NULL OR pid_neg_n_days_since_last_purchase <= 0"
    - name: accepted_values
      column: last_click_before_last_purchase
      values: [0, 1]
      ignore_nulls: true
    - name: accepted_range
      column: pid_n_clicks_3d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: pid_n_clicks_7d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: pid_n_clicks_14d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: pid_n_clicks_28d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: pid_n_atcs_3d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: pid_n_atcs_7d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: pid_n_atcs_14d_ratio
      min: 0
