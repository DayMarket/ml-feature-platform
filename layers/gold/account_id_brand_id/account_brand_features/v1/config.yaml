resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-gold-account-brand-features
  main_application_file: local:///git/repo/layers/gold/account_id_brand_id/account_brand_features/v1/entrypoints/get_account_brand_features.py
  resource_profile: small

table:
  key: account_brand_features
  catalog: iceberg
  schema: gold
  name: feature_platform_account_brand_features
  primary_key: calculated_at,account_id,brand_id
  feature_namespace: ACCOUNT_BRAND
  meta:
    team: team::recsys
    create_dbt_pr: false
    create_maintenance_pr: true

source:
  engine: spark_iceberg
  product_metadata_table: iceberg.silver.feature_platform_product_metadata
  action_counts_table: iceberg.silver.feature_platform_account_product_session_action_counts_12h
  order_items_table: iceberg.silver.order_items
  sku_table: iceberg.silver.sku
  business_timezone: Asia/Tashkent

dag:
  id: feature-platform.layers.gold.account_id_brand_id.account_brand_features
  group_tag: recsys-features
  schedule: "0 7,19 * * *"
  start_date: "2026-08-08T07:00:00Z"
  catchup: true
  team: recsys
  owner: team:recsys

# Метаданные alert-routing обязательны для платформенного конфига, но все
# failure callbacks G3 отключены в dag.py до завершения отладки.
alerts:
  team: recsys
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_recsys

dq:
  trino_conn_id: trino_recsys
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 12
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d %H:%M:%S") }}'
  tests:
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn
    - name: expression_is_true
      expression: "account_id > 0 AND brand_id > 0 AND brand_id != 160078"
    - name: non_negative
      columns:
        - n_clicks_3d
        - n_clicks_7d
        - n_clicks_14d
        - n_clicks_28d
        - gmv_3d
        - gmv_7d
        - gmv_14d
        - gmv_28d
        - gmv_60d
        - gmv_90d
    - name: accepted_range
      column: gmv_3d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: gmv_7d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: gmv_14d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: gmv_28d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: gmv_60d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: gmv_90d_ratio
      min: 0
      max: 1

feature_stats:
  trino_conn_id: trino_recsys
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 12
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d %H:%M:%S") }}'
  exclude_columns: []
