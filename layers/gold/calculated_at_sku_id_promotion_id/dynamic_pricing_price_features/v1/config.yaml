# Trino + Iceberg-source layer pipeline (Airflow/Python + pyiceberg), not Spark.
table:
  key: dynamic_pricing_price_features
  catalog: iceberg
  schema: gold
  name: feature_platform_dynamic_pricing_price_features
  primary_key: calculated_at,sku_id,promotion_id
  meta:
    team: team:search

source:
  engine: trino_iceberg
  trino_conn_id: trino_search
  history_days: 15

runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2

dag:
  id: feature-platform.layers.gold.calculated_at_sku_id_promotion_id.dynamic_pricing_price_features
  group_tag: dynamic-pricing-prices
  schedule: "0 */3 * * *"
  start_date: "2026-06-29T00:00:00Z"
  team: search
  owner: team:search
  upstream_dag_id: merge_center_solution_to_kafka_gurobi_mvp_dag

alerts:
  team: search
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_search

dq:
  trino_conn_id: trino_search
  # Энтити снапшотная: DAG идёт раз в 3 часа и пишет отдельный calculated_at, а не
  # дописывает дневную партицию. Проверяем ровно записанный снапшот — дневная
  # партиция на момент запуска дописана лишь частично.
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 3
  # Джоб пишет calculated_at = data_interval_end (см. runtime.parse_snapshot_timestamp).
  partition_date_template: '{{ data_interval_end.in_timezone("UTC").strftime("%Y-%m-%d %H:%M:%S") }}'
  tests:
    # Раскатка DQ идёт на витрины, часть которых пуста или отстала на недели.
    # Объёмные тесты и freshness — в warn: состояние фиксируется в
    # feature_platform_dq_results, но дежурного не будит. Перевод в error —
    # по мере починки витрины, с порогом по её реальной истории (AGENTS.md).
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn

feature_stats:
  trino_conn_id: trino_search
  # Все четыре поля дословно повторяют блок dq: энтити пишет 8 партиций в сутки,
  # и профиль обязан относиться ровно к тому снапшоту, который проверял DQ.
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 3
  partition_date_template: '{{ data_interval_end.in_timezone("UTC").strftime("%Y-%m-%d %H:%M:%S") }}'
  exclude_columns:
    - sku_group_id
    - product_id
