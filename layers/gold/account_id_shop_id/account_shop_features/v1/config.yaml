resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-gold-account-shop-features
  main_application_file: local:///git/repo/layers/gold/account_id_shop_id/account_shop_features/v1/entrypoints/get_account_shop_features.py
  resource_profile: small

table:
  key: account_shop_features
  catalog: iceberg
  schema: gold
  name: feature_platform_account_shop_features
  primary_key: calculated_at,account_id,shop_id
  feature_namespace: ACCOUNT_SHOP
  meta:
    team: team::recsys
    create_dbt_pr: false
    create_maintenance_pr: true

source:
  engine: spark_iceberg
  product_metadata_table: iceberg.silver.feature_platform_product_metadata
  action_counts_table: iceberg.silver.feature_platform_account_product_session_action_counts_12h
  order_items_table: iceberg.silver.order_items
  sku_table: iceberg.silver.sku
  business_timezone: Asia/Tashkent

dag:
  id: feature-platform.layers.gold.account_id_shop_id.account_shop_features
  group_tag: recsys-features
  schedule: "0 7,19 * * *"
  start_date: "2026-09-05T07:00:00Z"
  catchup: true
  team: recsys
  owner: team:recsys

# Alert routing is ready, but callbacks stay disabled in dag.py during debugging.
alerts:
  team: recsys
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_recsys

dq:
  trino_conn_id: trino_recsys
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 12
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d %H:%M:%S") }}'
  tests:
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn
    - name: expression_is_true
      expression: "account_id > 0 AND shop_id > 0"
    - name: non_negative
      columns:
        - n_clicks_3d
        - n_clicks_7d
        - n_clicks_14d
        - n_clicks_28d
        - n_atcs_3d
        - n_atcs_7d
        - n_atcs_14d
        - n_atcs_28d
        - n_atfs_3d
        - n_atfs_7d
        - n_atfs_14d
        - n_atfs_28d
        - n_orders_3d
        - n_orders_7d
        - n_orders_14d
        - n_orders_28d
        - n_orders_60d
        - n_orders_90d
        - gmv_3d
        - gmv_7d
        - gmv_14d
        - gmv_28d
        - gmv_60d
        - gmv_90d
    - name: expression_is_true
      expression: "n_clicks_3d <= n_clicks_7d AND n_clicks_7d <= n_clicks_14d AND n_clicks_14d <= n_clicks_28d"
    - name: expression_is_true
      expression: "n_atcs_3d <= n_atcs_7d AND n_atcs_7d <= n_atcs_14d AND n_atcs_14d <= n_atcs_28d"
    - name: expression_is_true
      expression: "n_atfs_3d <= n_atfs_7d AND n_atfs_7d <= n_atfs_14d AND n_atfs_14d <= n_atfs_28d"
    - name: expression_is_true
      expression: "n_orders_3d <= n_orders_7d AND n_orders_7d <= n_orders_14d AND n_orders_14d <= n_orders_28d AND n_orders_28d <= n_orders_60d AND n_orders_60d <= n_orders_90d"
    - name: expression_is_true
      expression: "gmv_3d <= gmv_7d AND gmv_7d <= gmv_14d AND gmv_14d <= gmv_28d AND gmv_28d <= gmv_60d AND gmv_60d <= gmv_90d"
    - name: accepted_range
      column: n_clicks_3d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: n_clicks_7d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: n_clicks_14d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: n_clicks_28d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: n_atcs_3d_ratio
      min: 0
      max: 1
    - name: accepted_range
      column: n_atcs_7d_ratio
      min: 0
      max: 1
    - name: accepted_range
