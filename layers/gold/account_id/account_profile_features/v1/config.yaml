resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-gold-account-profile-features
  main_application_file: local:///git/repo/layers/gold/account_id/account_profile_features/v1/entrypoints/get_account_profile_features.py
  resource_profile: small

table:
  key: account_profile_features
  catalog: iceberg
  schema: gold
  name: feature_platform_account_profile_features
  primary_key: calculated_at,account_id
  feature_namespace: ACCOUNT_PROFILE
  meta:
    team: team::recsys
    create_dbt_pr: false
    create_maintenance_pr: true

source:
  engine: spark_iceberg
  demographics_table: iceberg.silver.feature_platform_account_demographics
  product_metadata_table: iceberg.silver.feature_platform_product_metadata
  product_prices_table: iceberg.silver.feature_platform_product_prices_daily
  action_counts_table: iceberg.silver.feature_platform_account_product_session_action_counts_12h
  order_items_table: iceberg.silver.order_items
  sku_table: iceberg.silver.sku
  category_gender_features_table: iceberg.gold.feature_platform_category_gender_features
  product_base_features_table: iceberg.gold.feature_platform_product_base_features
  product_ranking_features_table: iceberg.gold.feature_platform_product_ranking_features
  business_timezone: Asia/Tashkent

dag:
  id: feature-platform.layers.gold.account_id.account_profile_features
  group_tag: recsys-features
  schedule: "0 7,19 * * *"
  start_date: "2026-09-05T07:00:00Z"
  catchup: true
  team: recsys
  owner: team:recsys

# Alert routing is ready, but callbacks stay disabled in dag.py during debugging.
alerts:
  team: recsys
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_recsys

dq:
  trino_conn_id: trino_recsys
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 12
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d %H:%M:%S") }}'
  tests:
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn
    - name: expression_is_true
      expression: "account_id > 0"
    - name: accepted_values
      column: ACCOUNT_PROFILE__gender
      values: [MALE, FEMALE]
    - name: accepted_values
      column: ACCOUNT_PROFILE__gender_is_female
      values: [0, 1]
    - name: accepted_values
      column: ACCOUNT_PROFILE__age_bucket
      values: [LT_18, "18_24", "25_34", "35_44", "45_54", 55_PLUS, UNKNOWN]
    - name: accepted_values
      column: ACCOUNT_PROFILE__platform
      values: [IOS, ANDROID, WEB]
    - name: non_negative
      columns:
        - ACCOUNT_PROFILE__age
        - ACCOUNT_PROFILE__median_order_total_7d
        - ACCOUNT_PROFILE__median_order_total_28d
        - ACCOUNT_PROFILE__median_order_total_90d
        - ACCOUNT_PROFILE__max_order_total_7d
        - ACCOUNT_PROFILE__max_order_total_28d
        - ACCOUNT_PROFILE__max_order_total_90d
        - ACCOUNT_PROFILE__min_order_total_7d
        - ACCOUNT_PROFILE__min_order_total_28d
        - ACCOUNT_PROFILE__min_order_total_90d
        - ACCOUNT_PROFILE__sum_order_total_7d
        - ACCOUNT_PROFILE__sum_order_total_28d
        - ACCOUNT_PROFILE__sum_order_total_90d
        - ACCOUNT_PROFILE__avg_item_price_from_orders_7d
        - ACCOUNT_PROFILE__avg_item_price_from_orders_28d
        - ACCOUNT_PROFILE__avg_item_price_from_orders_90d
        - ACCOUNT_PROFILE__n_last_purchased_products_7d
        - ACCOUNT_PROFILE__n_last_purchased_products_28d
        - ACCOUNT_PROFILE__n_last_purchased_products_90d
        - ACCOUNT_PROFILE__last_clicked_avg_price
        - ACCOUNT_PROFILE__last_clicked_median_price
        - ACCOUNT_PROFILE__last_clicked_90th_pct_price
    - name: expression_is_true
      expression: "ACCOUNT_PROFILE__min_order_total_7d <= ACCOUNT_PROFILE__median_order_total_7d AND ACCOUNT_PROFILE__median_order_total_7d <= ACCOUNT_PROFILE__max_order_total_7d"
    - name: expression_is_true
      expression: "ACCOUNT_PROFILE__min_order_total_28d <= ACCOUNT_PROFILE__median_order_total_28d AND ACCOUNT_PROFILE__median_order_total_28d <= ACCOUNT_PROFILE__max_order_total_28d"
    - name: expression_is_true
      expression: "ACCOUNT_PROFILE__min_order_total_90d <= ACCOUNT_PROFILE__median_order_total_90d AND ACCOUNT_PROFILE__median_order_total_90d <= ACCOUNT_PROFILE__max_order_total_90d"
    - name: expression_is_true
      expression: "ACCOUNT_PROFILE__last_purchased_male_cat_share_7d IS NULL OR ABS(ACCOUNT_PROFILE__last_purchased_male_cat_share_7d + ACCOUNT_PROFILE__last_purchased_female_cat_share_7d + ACCOUNT_PROFILE__last_purchased_unisex_cat_share_7d - 1.0) < 0.000001"
    - name: expression_is_true
      expression: "ACCOUNT_PROFILE__last_purchased_male_cat_share_28d IS NULL OR ABS(ACCOUNT_PROFILE__last_purchased_male_cat_share_28d + ACCOUNT_PROFILE__last_purchased_female_cat_share_28d + ACCOUNT_PROFILE__last_purchased_unisex_cat_share_28d - 1.0) < 0.000001"
    - name: expression_is_true
      expression: "ACCOUNT_PROFILE__last_purchased_male_cat_share_90d IS NULL OR ABS(ACCOUNT_PROFILE__last_purchased_male_cat_share_90d + ACCOUNT_PROFILE__last_purchased_female_cat_share_90d + ACCOUNT_PROFILE__last_purchased_unisex_cat_share_90d - 1.0) < 0.000001"
    - name: expression_is_true
      expression: "ACCOUNT_PROFILE__last_clicked_male_cat_share IS NULL OR ACCOUNT_PROFILE__last_clicked_male_cat_share + ACCOUNT_PROFILE__last_clicked_female_cat_share <= 1.000001"
    - name: expression_is_true
      expression: "(ACCOUNT_PROFILE__last_clicked_female_cat_share_among_gendered IS NULL AND ACCOUNT_PROFILE__last_clicked_male_cat_share_among_gendered IS NULL) OR ABS(ACCOUNT_PROFILE__last_clicked_female_cat_share_among_gendered + ACCOUNT_PROFILE__last_clicked_male_cat_share_among_gendered - 1.0) < 0.000001"
    - name: accepted_range
      column: ACCOUNT_PROFILE__last_clicked_male_cat_share
      min: 0
      max: 1
    - name: accepted_range
      column: ACCOUNT_PROFILE__last_clicked_female_cat_share
      min: 0
      max: 1
    - name: accepted_range
      column: ACCOUNT_PROFILE__last_clicked_null_rating_share
