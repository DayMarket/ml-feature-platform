# Trino-source layer pipeline (Airflow/Python + pyiceberg), not Spark.
table:
  key: buyout_online_account_features
  catalog: iceberg
  schema: gold
  name: feature_platform_buyout_online_account_features
  primary_key: date,account_id
  meta:
    team: team:buyer

source:
  engine: trino
  # Домена buyer среди connection нет; значение подтверждает владелец (см. README).
  trino_conn_id: trino_bx_analytics
  # Имя витрины-источника берётся из её config.yaml, здесь не дублируется.
  entity_path: layers/gold/account_id/buyout_account_history_features/v1
  # Партиция читается по остатку account_id: одна выгрузка целиком не помещается в память задачи.
  shards: 16

runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2

dag:
  id: feature-platform.layers.gold.account_id.buyout_online_account_features
  group_tag: buyout-features
  schedule: "0 6 * * *"
  start_date: "2026-08-20T00:00:00Z"
  team: buyer
  owner: team:buyer

alerts:
  team: buyer
  severity: P2
  oncall_webhook_conn_id: team:buyer

dq:
  trino_conn_id: trino_search
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  tests:
    # Раскатка DQ идёт на витрины, часть которых пуста или отстала на недели.
    # Объёмные тесты и freshness — в warn: состояние фиксируется в
    # feature_platform_dq_results, но дежурного не будит. Перевод в error —
    # по мере починки витрины, с порогом по её реальной истории (AGENTS.md).
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn

feature_stats:
  trino_conn_id: trino_search
  # Дословно совпадает с dq.partition_date_template: обе таски обязаны
  # смотреть на одну партицию, иначе профиль посчитан не по тем данным.
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  exclude_columns: [last_order_city_id, last_order_region_id, first_order_id_ever]
