resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-gold-product-cm2-main-features
  main_application_file: local:///git/repo/layers/gold/product_id/product_cm2_main_features/v1/entrypoints/get_product_cm2_main_features.py
  resource_profile: small

table:
  key: product_cm2_main_features
  catalog: iceberg
  schema: gold
  name: feature_platform_product_cm2_main_features
  primary_key: calculated_at,product_id
  feature_namespace: PRODUCT_CM2_MAIN
  meta:
    team: team::recsys
    create_dbt_pr: false
    create_maintenance_pr: true

source:
  engine: spark_iceberg
  sku_cm2_inputs_table: iceberg.silver.feature_platform_sku_cm2_inputs_daily
  currency_rates_table: iceberg.gold.currency_rates
  business_timezone: Asia/Tashkent

dag:
  id: feature-platform.layers.gold.product_id.product_cm2_main_features
  group_tag: recsys-features
  schedule: "0 7,19 * * *"
  start_date: "2026-09-05T07:00:00Z"
  catchup: true
  team: recsys
  owner: team:recsys

# Alert routing is ready, but callbacks stay disabled in dag.py during debugging.
alerts:
  team: recsys
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_recsys

dq:
  trino_conn_id: trino_recsys
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 12
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d %H:%M:%S") }}'
  tests:
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn
    - name: expression_is_true
      expression: "product_id > 0"
    - name: not_null
      columns:
        - PRODUCT_CM2_MAIN__cm2_main_uzs
    - name: finite
      columns:
        - PRODUCT_CM2_MAIN__cm2_main_uzs

feature_stats:
  trino_conn_id: trino_recsys
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 12
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d %H:%M:%S") }}'
  exclude_columns: []
