resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-gold-product-base-features
  main_application_file: local:///git/repo/layers/gold/product_id/product_base_features/v1/entrypoints/get_product_base_features.py
  resource_profile: small

table:
  key: product_base_features
  catalog: iceberg
  schema: gold
  name: feature_platform_product_base_features
  primary_key: calculated_at,product_id
  feature_namespace: PRODUCT
  meta:
    team: team::recsys
    create_dbt_pr: false
    create_maintenance_pr: true

source:
  engine: spark_iceberg
  product_metadata_table: iceberg.silver.feature_platform_product_metadata
  product_prices_table: iceberg.silver.feature_platform_product_prices_daily
  sku_cm2_inputs_table: iceberg.silver.feature_platform_sku_cm2_inputs_daily
  action_counts_table: iceberg.silver.feature_platform_account_product_session_action_counts_12h
  feedback_counts_table: iceberg.silver.feature_platform_product_feedback_counts_12h
  order_items_table: iceberg.silver.order_items
  sku_table: iceberg.silver.sku
  product_feedback_base_stats_table: iceberg.gold.feature_platform_product_feedback_base_stats
  category_demographic_features_table: iceberg.gold.feature_platform_category_demographic_features
  business_timezone: Asia/Tashkent

dag:
  id: feature-platform.layers.gold.product_id.product_base_features
  group_tag: recsys-features
  schedule: "0 7,19 * * *"
  start_date: "2026-09-13T07:00:00Z"
  catchup: true
  team: recsys
  owner: team:recsys

# Alert routing is ready, but callbacks stay disabled in dag.py during debugging.
alerts:
  team: recsys
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_recsys

dq:
  trino_conn_id: trino_recsys
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 12
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d %H:%M:%S") }}'
  tests:
    - name: freshness
      severity: warn
    - name: row_count_min
      severity: warn
    - name: row_count_growth
      severity: warn
    - name: expression_is_true
      expression: "product_id > 0"
    - name: non_negative
      columns:
        - PRODUCT__min_sell_price_eod
        - PRODUCT__avg_sell_price_eod
        - PRODUCT__max_sell_price_eod
        - PRODUCT__weighted_price
        - PRODUCT__min_full_price_eod
        - PRODUCT__max_full_price_eod
        - PRODUCT__min_active_sku_sell_price_eod
        - PRODUCT__avg_active_sku_sell_price_eod
        - PRODUCT__max_active_sku_sell_price_eod
        - PRODUCT__age_in_days
        - PRODUCT__clicks_3d
        - PRODUCT__clicks_28d
        - PRODUCT__favorites_1d
        - PRODUCT__favorites_last_3d
        - PRODUCT__favorites_last_7d
        - PRODUCT__favorites_last_14d
        - PRODUCT__favorites_last_21d
        - PRODUCT__favorites_last_28d
        - PRODUCT__orders_1d
        - PRODUCT__orders_total
        - PRODUCT__orders_7d
        - PRODUCT__orders_28d
        - PRODUCT__orders_90d
        - PRODUCT__category_orders_7d
        - PRODUCT__category_orders_28d
        - PRODUCT__category_orders_90d
        - PRODUCT__feedback_quantity_1d
        - PRODUCT__feedback_last_3d
        - PRODUCT__feedback_gte_4_3d
        - PRODUCT__feedback_lte_3_3d
        - PRODUCT__feedback_last_28d
        - PRODUCT__feedback_gte_4_28d
        - PRODUCT__feedback_lte_3_28d
        - PRODUCT__feedback_quantity
        - PRODUCT__feedback_gte_4
        - PRODUCT__feedback_lte_3
        - PRODUCT__log_feedback_quantity
        - PRODUCT__feedback_to_orders_rate_raw
        - PRODUCT__feedback_gte_4_to_orders_rate_raw
        - PRODUCT__feedback_lte_3_to_orders_rate_raw
        - PRODUCT__feedback_gte_4_to_orders_rate_28d
        - PRODUCT__feedback_lte_3_to_orders_rate_28d
        - PRODUCT__return_rate_neg_28d
        - PRODUCT__return_rate_neg_90d
    - name: accepted_values
      column: PRODUCT__has_orders
      values: [0, 1]
    - name: accepted_values
      column: PRODUCT__category_is_female
      values: [0, 1]
    - name: accepted_values
      column: PRODUCT__category_is_male
      values: [0, 1]
    - name: accepted_range
      column: PRODUCT__discount
      min: 0
      max: 100
    - name: accepted_range
      column: PRODUCT__rating
      min: 1
      max: 5
    - name: expression_is_true
      expression: "PRODUCT__min_sell_price_eod IS NULL OR (PRODUCT__min_sell_price_eod <= PRODUCT__avg_sell_price_eod AND PRODUCT__avg_sell_price_eod <= PRODUCT__max_sell_price_eod)"
    - name: expression_is_true
      expression: "PRODUCT__min_full_price_eod IS NULL OR PRODUCT__min_full_price_eod <= PRODUCT__max_full_price_eod"
    - name: expression_is_true
      expression: "PRODUCT__min_active_sku_sell_price_eod IS NULL OR (PRODUCT__min_active_sku_sell_price_eod <= PRODUCT__avg_active_sku_sell_price_eod AND PRODUCT__avg_active_sku_sell_price_eod <= PRODUCT__max_active_sku_sell_price_eod)"
    - name: expression_is_true
      expression: "PRODUCT__orders_7d <= PRODUCT__orders_28d AND PRODUCT__orders_28d <= PRODUCT__orders_90d AND PRODUCT__orders_90d <= PRODUCT__orders_total"
    - name: expression_is_true
      expression: "PRODUCT__feedback_gte_4 + PRODUCT__feedback_lte_3 = PRODUCT__feedback_quantity"
    - name: expression_is_true
      expression: "(PRODUCT__feedback_quantity = 0 AND PRODUCT__feedback_gte_4_ratio IS NULL AND PRODUCT__feedback_lte_3_ratio IS NULL) OR (PRODUCT__feedback_gte_4_ratio BETWEEN 0 AND 1 AND PRODUCT__feedback_lte_3_ratio BETWEEN 0 AND 1 AND ABS(PRODUCT__feedback_gte_4_ratio + PRODUCT__feedback_lte_3_ratio - 1.0) < 0.000001)"
    - name: expression_is_true
      expression: "PRODUCT__feedback_gte_4_3d + PRODUCT__feedback_lte_3_3d = PRODUCT__feedback_last_3d AND PRODUCT__feedback_gte_4_28d + PRODUCT__feedback_lte_3_28d = PRODUCT__feedback_last_28d"
    - name: expression_is_true
      expression: "(PRODUCT__feedback_gte_4_ratio_3d IS NULL OR PRODUCT__feedback_gte_4_ratio_3d BETWEEN 0 AND 1) AND (PRODUCT__feedback_lte_3_ratio_3d IS NULL OR PRODUCT__feedback_lte_3_ratio_3d BETWEEN 0 AND 1) AND (PRODUCT__feedback_gte_4_ratio_28d IS NULL OR PRODUCT__feedback_gte_4_ratio_28d BETWEEN 0 AND 1) AND (PRODUCT__feedback_lte_3_ratio_28d IS NULL OR PRODUCT__feedback_lte_3_ratio_28d BETWEEN 0 AND 1)"
    - name: expression_is_true
      expression: "(PRODUCT__feedback_avg_rating_3d IS NULL OR PRODUCT__feedback_avg_rating_3d BETWEEN 1 AND 5) AND (PRODUCT__feedback_avg_rating_28d IS NULL OR PRODUCT__feedback_avg_rating_28d BETWEEN 1 AND 5)"
    - name: expression_is_true
      expression: "(PRODUCT__category_orders_share_7d IS NULL OR PRODUCT__category_orders_share_7d BETWEEN 0 AND 1) AND (PRODUCT__category_orders_share_28d IS NULL OR PRODUCT__category_orders_share_28d BETWEEN 0 AND 1) AND (PRODUCT__category_orders_share_90d IS NULL OR PRODUCT__category_orders_share_90d BETWEEN 0 AND 1)"
    - name: expression_is_true
      expression: "(PRODUCT__return_rate_neg_28d IS NULL OR PRODUCT__return_rate_neg_28d BETWEEN -1 AND 0) AND (PRODUCT__return_rate_neg_90d IS NULL OR PRODUCT__return_rate_neg_90d BETWEEN -1 AND 0)"
    - name: expression_is_true
      expression: "(PRODUCT__category_female_click_share_28d IS NULL OR PRODUCT__category_female_click_share_28d BETWEEN 0 AND 1) AND (PRODUCT__category_male_click_share_28d IS NULL OR PRODUCT__category_male_click_share_28d BETWEEN 0 AND 1)"
    - name: expression_is_true
      expression: "PRODUCT__category_female_click_share_28d IS NULL OR ABS(PRODUCT__category_female_click_share_28d + PRODUCT__category_male_click_share_28d - 1.0) < 0.000001"
    - name: expression_is_true
      expression: "PRODUCT__category_clicker_age_p10_28d IS NULL OR (PRODUCT__category_clicker_age_p10_28d BETWEEN 13 AND 100 AND PRODUCT__category_clicker_age_p10_28d <= PRODUCT__category_clicker_age_p50_28d AND PRODUCT__category_clicker_age_p50_28d <= PRODUCT__category_clicker_age_p90_28d AND PRODUCT__category_clicker_age_p90_28d BETWEEN 13 AND 100)"
    - name: expression_is_true
      expression: "COALESCE(PRODUCT__category_is_female, 0) + COALESCE(PRODUCT__category_is_male, 0) <= 1"

feature_stats:
  trino_conn_id: trino_recsys
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 12
  partition_date_template: '{{ data_interval_end.in_timezone("Asia/Tashkent").strftime("%Y-%m-%d %H:%M:%S") }}'
  exclude_columns: []
