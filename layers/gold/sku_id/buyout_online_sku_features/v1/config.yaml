# Trino-source layer pipeline (Airflow/Python + pyiceberg), not Spark.
table:
  key: buyout_online_sku_features
  catalog: iceberg
  schema: gold
  name: feature_platform_buyout_online_sku_features
  primary_key: date,sku_id
  meta:
    team: team:buyer

source:
  engine: trino
  trino_conn_id: trino_search

runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2

dag:
  id: feature-platform.layers.gold.sku_id.buyout_online_sku_features
  group_tag: buyout-features
  schedule: "0 6 * * *"
  start_date: "2026-08-20T00:00:00Z"
  team: buyer
  owner: team:buyer

alerts:
  team: buyer
  severity: P2
  oncall_webhook_conn_id: oncall_webhook_buyer
