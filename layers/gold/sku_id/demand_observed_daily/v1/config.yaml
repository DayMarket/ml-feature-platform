table:
  key: demand_observed_daily
  catalog: iceberg
  schema: gold
  name: feature_platform_demand_observed_daily
  primary_key: date,sku_id
  meta:
    team: team:operations
inputs:
  sales_config: layers/silver/sku_id/demand_sales_daily/v1/config.yaml
  stock_config: layers/silver/sku_id/demand_stock_daily/v1/config.yaml
source:
  conn_id: trino_search
  contract_version: observed_daily_sparse_stock_v2
runtime:
  image: ghcr.io/daymarket/airflow:3.1.8-python3.11-ml-2
  cpu: "2"
  memory: 8Gi
  refresh_days: 31
  history_start: "2022-09-01"
  run_timeout_seconds:
    regular: 21600
    manual: 604800
  max_batch_rows: 100000
  max_batch_bytes: 67108864
  delivery_status: prepared_local
dag:
  id: feature-platform.layers.gold.sku_id.demand_observed_daily
  group_tag: demand-forecast
  team: operations
  owner: team:operations
  schedule: 0 5 * * *
  start_date: "2026-09-08T00:00:00Z"
  catchup: false
alerts:
  team: operations-analytics
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_operations
# Штатные пороги; проверка источников и exact upstream DQ обязательны дополнительно.
# Наличие строки sales/stock не подменяет полноту исходного дня.
dq:
  trino_conn_id: trino_search
  warmup_days: 0
  partition_column: date
  partition_date_template: '{{ ti.xcom_pull(task_ids="write_observed")["dates"][-1] }}'
  tests:
    # Freshness/growth по умолчанию: последний завершённый день на момент записи.
    # Исторические даты проверяет dq.day_range без этих двух временных тестов.
    - name: not_null
      columns: [sales_component_present, is_in_stock_eod, sales_snapshot_id, stock_snapshot_id, sales_table_uuid, stock_table_uuid, source_manifest_id, source_contract_version, ingested_at]
    - name: accepted_range
      column: sku_id
      min: 1
    - name: accepted_range
      column: sales_snapshot_id
      min: 1
    - name: accepted_range
      column: stock_snapshot_id
      min: 1
    - name: string_not_blank
      columns: [sales_table_uuid, stock_table_uuid, source_manifest_id, source_contract_version]
    - name: expression_is_true
      expression: "sales_component_present OR is_in_stock_eod"
feature_stats:
  trino_conn_id: trino_search
  partition_column: date
  partition_date_template: '{{ ti.xcom_pull(task_ids="write_observed")["dates"][-1] }}'
  exclude_columns: [sales_snapshot_id, stock_snapshot_id]
