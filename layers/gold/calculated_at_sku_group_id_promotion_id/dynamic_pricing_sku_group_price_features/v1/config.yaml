resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-gold-dynamic-pricing-sku-group-price-features
  main_application_file: local:///git/repo/layers/gold/calculated_at_sku_group_id_promotion_id/dynamic_pricing_sku_group_price_features/v1/entrypoints/get_dynamic_pricing_sku_group_price_features.py
  resource_profile: large

table:
  key: dynamic_pricing_sku_group_price_features
  catalog: iceberg
  schema: gold
  name: feature_platform_dynamic_pricing_sku_group_price_features
  primary_key: calculated_at,sku_group_id,promotion_id
  meta:
    team: team:search

source:
  engine: spark_iceberg
  sku_price_table: iceberg.gold.feature_platform_dynamic_pricing_price_features

dag:
  id: feature-platform.layers.gold.calculated_at_sku_group_id_promotion_id.dynamic_pricing_sku_group_price_features
  group_tag: dynamic-pricing-prices
  schedule: "0 */3 * * *"
  start_date: "2026-06-29T00:00:00Z"
  team: search
  owner: team:search

alerts:
  team: search
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_search

dq:
  trino_conn_id: trino_search
  # Энтити снапшотная: DAG идёт раз в 3 часа и пишет отдельный calculated_at, а не
  # дописывает дневную партицию. Проверяем ровно записанный снапшот — дневная
  # партиция на момент запуска дописана лишь частично.
  partition_granularity: timestamp
  partition_column: calculated_at
  snapshot_interval_hours: 3
  # Джоб пишет calculated_at = data_interval_end (см. _parse_snapshot_timestamp).
  partition_date_template: '{{ data_interval_end.in_timezone("UTC").strftime("%Y-%m-%d %H:%M:%S") }}'
  tests:
    # Между соседними снапшотами объём гуляет в -25.0%..+33.4% (141 пара за июль):
    # промо появляются и заканчиваются внутри суток. 50% — полтора запаса к максимуму,
    # порог остаётся детектором обвала, а не датчиком промо-активности.
    - name: row_count_growth
      max_growth_ratio: 0.5
    # Снапшот стабильно весит 15.1M-20.7M строк. 12M ниже всей наблюдаемой истории.
    - name: row_count_min
      min_rows: 12000000
    # У снапшотной энтити max_lag_days меряется в часах: 1 день = 24 часа, то есть
    # 8 пропущенных запусков подряд. Дефолтные 2 дня для трёхчасового DAG'а слишком мягки.
    - name: freshness
      max_lag_days: 1
    # За 33 снапшота (около 515M строк) ни одного NULL и ни одного отрицательного
    # значения: цены и скидки агрегируются из непустого SKU-уровня.
    - name: not_null
      columns:
        - min_sell_price
        - max_sell_price
        - avg_sell_price
        - min_discount
        - max_discount
        - avg_discount
        - min_discount_fraction
        - max_discount_fraction
        - avg_discount_fraction
    - name: non_negative
      columns:
        - min_sell_price
        - max_sell_price
        - avg_sell_price
        - min_discount
        - max_discount
        - avg_discount
        - min_discount_fraction
        - max_discount_fraction
        - avg_discount_fraction
