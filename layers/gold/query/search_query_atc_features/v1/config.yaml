resources:
  path: ../../../../../config/spark/resources.yaml

spark:
  template_path: ../../../../../config/spark/layer_spark_application.yaml
  application_name: fetch-gold-search-query-atc-features
  main_application_file: local:///git/repo/layers/gold/query/search_query_atc_features/v1/entrypoints/get_search_query_atc_features.py
  resource_profile: medium

table:
  key: search_query_atc_features
  catalog: iceberg
  schema: gold
  name: feature_platform_search_query_atc_features
  primary_key: date,query
  meta:
    team: team:search
dag:
  team: search

alerts:
  team: search
  severity: P3
  oncall_webhook_conn_id: oncall_webhook_search

dq:
  trino_conn_id: trino_search
  # Джоб пишет партицию за data_interval_start (partition_start[:10]).
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  tests:
    # За 109 пар соседних партиций рост держится в -0.90%..+2.01%, p95 |рост| = 1.5%.
    # 5% — 2.5x к наблюдаемому максимуму: ловит обрыв записи, но не дёргает на
    # обычных всплесках поискового спроса.
    - name: row_count_growth
      max_growth_ratio: 0.05
    # Минимум за последние 30 партиций — 30.35M строк, текущая — 32.4M.
    # 25M ниже всей недавней истории и срабатывает только на частичной записи.
    - name: row_count_min
      min_rows: 25000000
    # За 7 партиций (около 220M строк) ни одного NULL и ни одного отрицательного
    # значения: все 24 фичи — счётчики показов, ATC и заказов за окно.
    - name: not_null
      columns:
        - query_uniq_impressions_1
        - query_uniq_atcs_1
        - query_orders_1
        - query_uniq_impressions_3
        - query_uniq_atcs_3
        - query_orders_3
        - query_uniq_impressions_7
        - query_uniq_atcs_7
        - query_orders_7
        - query_uniq_impressions_14
        - query_uniq_atcs_14
        - query_orders_14
        - query_uniq_impressions_21
        - query_uniq_atcs_21
        - query_orders_21
        - query_uniq_impressions_30
        - query_uniq_atcs_30
        - query_orders_30
        - query_uniq_impressions_60
        - query_uniq_atcs_60
        - query_orders_60
        - query_uniq_impressions_90
        - query_uniq_atcs_90
        - query_orders_90
    - name: non_negative
      columns:
        - query_uniq_impressions_1
        - query_uniq_atcs_1
        - query_orders_1
        - query_uniq_impressions_3
        - query_uniq_atcs_3
        - query_orders_3
        - query_uniq_impressions_7
        - query_uniq_atcs_7
        - query_orders_7
        - query_uniq_impressions_14
        - query_uniq_atcs_14
        - query_orders_14
        - query_uniq_impressions_21
        - query_uniq_atcs_21
        - query_orders_21
        - query_uniq_impressions_30
        - query_uniq_atcs_30
        - query_orders_30
        - query_uniq_impressions_60
        - query_uniq_atcs_60
        - query_orders_60
        - query_uniq_impressions_90
        - query_uniq_atcs_90
        - query_orders_90

feature_stats:
  trino_conn_id: trino_search
  # Дословно совпадает с dq.partition_date_template: обе таски обязаны смотреть
  # на одну партицию, иначе профиль посчитан не по тем данным, что проверял DQ.
  partition_date_template: '{{ data_interval_start.in_timezone("UTC").strftime("%Y-%m-%d") }}'
  exclude_columns: []
